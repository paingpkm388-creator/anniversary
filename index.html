<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Do You Love Me?</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="hearts" aria-hidden="true">
    <span class="heart" style="--left: 4%; --size: 22px; --duration: 8s; --delay: 0s; --drift: 34px;">&hearts;</span>
    <span class="heart" style="--left: 13%; --size: 16px; --duration: 10s; --delay: 1.3s; --drift: -22px;">&hearts;</span>
    <span class="heart" style="--left: 22%; --size: 28px; --duration: 9s; --delay: 2.1s; --drift: 42px;">&hearts;</span>
    <span class="heart" style="--left: 32%; --size: 18px; --duration: 11s; --delay: 0.7s; --drift: -38px;">&hearts;</span>
    <span class="heart" style="--left: 43%; --size: 24px; --duration: 8.5s; --delay: 1.8s; --drift: 28px;">&hearts;</span>
    <span class="heart" style="--left: 54%; --size: 17px; --duration: 10.5s; --delay: 2.9s; --drift: -34px;">&hearts;</span>
    <span class="heart" style="--left: 65%; --size: 30px; --duration: 9.5s; --delay: 0.4s; --drift: 46px;">&hearts;</span>
    <span class="heart" style="--left: 76%; --size: 19px; --duration: 12s; --delay: 1.5s; --drift: -28px;">&hearts;</span>
    <span class="heart" style="--left: 86%; --size: 26px; --duration: 8.8s; --delay: 2.5s; --drift: 24px;">&hearts;</span>
    <span class="heart" style="--left: 94%; --size: 15px; --duration: 10.8s; --delay: 0.9s; --drift: -40px;">&hearts;</span>
  </div>

  <main class="page">
    <img class="cute-gif" id="cuteGif" src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExOW53bGRoNzh5NG1ucXppNmpzYTFyanFkdWMyOG1jc29rdnlxdDVyeCZlcD12MV9naWZzX3NlYXJjaCZjdD1n/XYEEvoX0Ub69ZgN9ai/giphy.gif" alt="Cute animation">
    <h1>Do you love me?</h1>
    <p class="message" id="message">Please choose carefully.</p>

    <div class="actions">
      <button class="yes" id="yesBtn" type="button">Yes</button>
      <button class="no" id="noBtn" type="button">No</button>
    </div>
  </main>

  <section class="celebration" id="celebration" aria-live="polite">
    <div class="cheers" aria-hidden="true">
      <span style="--left: 6%; --delay: 0s; --duration: 2.7s;">&hearts;</span>
      <span style="--left: 16%; --delay: 0.3s; --duration: 2.4s;">*</span>
      <span style="--left: 28%; --delay: 0.1s; --duration: 2.8s;">&hearts;</span>
      <span style="--left: 42%; --delay: 0.5s; --duration: 2.5s;">*</span>
      <span style="--left: 55%; --delay: 0.2s; --duration: 3s;">&hearts;</span>
      <span style="--left: 68%; --delay: 0.6s; --duration: 2.6s;">*</span>
      <span style="--left: 80%; --delay: 0.15s; --duration: 2.9s;">&hearts;</span>
      <span style="--left: 92%; --delay: 0.45s; --duration: 2.5s;">*</span>
    </div>

    <img class="final-gif" src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExOW53bGRoNzh5NG1ucXppNmpzYTFyanFkdWMyOG1jc29rdnlxdDVyeCZlcD12MV9naWZzX3NlYXJjaCZjdD1n/WsRwFFRikFeAMriR15/giphy.gif" alt="Happy cute animation">
    <h2>I knew it! Love you too!</h2>
  </section>

  <script src="style.js"></script>
</body>
</html>
